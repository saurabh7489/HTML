<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz UI</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#65119d;
    }

    .quiz-box{
      width:450px;
      background:white;
      padding:20px;
      border-radius:12px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    .heading{
      text-align:center;
      margin-bottom:15px;
      font-size:28px;
      font-weight:bold;
    }

    .timer-box{
      background:lightblue;
      padding:12px;
      border-radius:8px;
      text-align:center;
      font-size:22px;
      font-weight:bold;
      margin-bottom:8px;
    }

    .question-count{
      font-size:12px;
      color:gray;
      margin-bottom:15px;
    }

    .question{
      font-size:20px;
      margin-bottom:20px;
    }

    .option-btn{
        text-align: left;
      width:100%;
      padding:12px;
      margin-bottom:10px;
      border:none;
      border-radius:8px;
      background:#e5e5e5;
      cursor:pointer;
      font-size:16px;
    }

    .option-btn:hover{
      background:#d4d4d4;
    }

    .next-btn{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:darkblue;
      color:white;
      font-size:16px;
      margin-top:10px;
      cursor:pointer;
    }

    .next-btn:hover{
      background:#00008b;
    }
  </style>
</head>
<body>

  <div class="quiz-box">

    <div class="heading">🧠Quiz Time!</div>

    <div class="timer-box">
      Time Left: 10s
    </div>

    <div class="question-count">
      Question 1 of 10
    </div>

    <div class="question">
      What is the capital of India?
    </div>
<ol type="a"  ><li>
    <button class="option-btn">Mumbai</button></li>
   <li ><button class="option-btn">Delhi</button></li>
   <li> <button class="option-btn">Chennai</button></li>
    <li><button class="option-btn">Kolkata</button></li>
</li>
</ol>
    <button class="next-btn">Next Question</button>

  </div>
<script src="quize.js"></script>
</body>
</html>
